# docker-compose.yml
# ---------------------------------------------------------------------------
# Eval:
#   Local Mac:   docker compose --profile local up local-cpu-eval
#   GCP CPU VM:  docker compose --profile gcp-cpu --env-file .env.gcp up gcp-cpu-eval
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-eval
# Train:
#   Local Mac:   docker compose --profile local up local-cpu-train
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-train
# ---------------------------------------------------------------------------

x-common-env: &common-env
  CHECKPOINT_PATH: /data/SiamEncFusionKPConv.pt
  DATA_DIR: /data/HKCD
  OUTPUT_DIR: /output
  BATCH_SIZE: ${BATCH_SIZE:-4}
  NUM_WORKERS: ${NUM_WORKERS:-2}
  MAX_BATCHES: ${MAX_BATCHES:-0}
  PYTHONPATH: /tp3d

services:
  # ── Local Mac ───────────────────────────────────────────────────────────
  local-cpu-eval:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:-./output}:/output:rw
    environment:
      <<: *common-env
      DEVICE: cpu
    working_dir: /tp3d

  # ── GCP CPU VM ──────────────────────────────────────────────────────────
  gcp-cpu-eval:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      network: host
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    network_mode: host
    shm_size: '4gb'
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:-./output}:/output:rw
    environment:
      <<: *common-env
      DEVICE: cpu
    working_dir: /tp3d

  # ── GCP GPU VM ──────────────────────────────────────────────────────────
  gcp-gpu-eval:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:-./output}:/output:rw
    environment:
      <<: *common-env
      DEVICE: cuda
      BATCH_SIZE: ${BATCH_SIZE:-10}
      NUM_WORKERS: ${NUM_WORKERS:-4}
      NVIDIA_VISIBLE_DEVICES: all
    working_dir: /tp3d
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Training ─────────────────────────────────────────────────────────────
  local-cpu-train:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:-./output}:/output:rw
    environment:
      <<: *common-env
      DEVICE: cpu
    working_dir: /tp3d
    command: ["trainSiamKPConv.py"]

  gcp-gpu-train:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:-./output}:/output:rw
    environment:
      <<: *common-env
      DEVICE: cuda
      BATCH_SIZE: ${BATCH_SIZE:-10}
      NUM_WORKERS: ${NUM_WORKERS:-4}
      NVIDIA_VISIBLE_DEVICES: all
    working_dir: /tp3d
    command: ["trainSiamKPConv.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
