# docker-compose.yml
# ---------------------------------------------------------------------------
# Eval (baseline):
#   Local Mac:   docker compose --profile local up local-cpu-eval
#   GCP CPU VM:  docker compose --profile gcp-cpu --env-file .env.gcp up gcp-cpu-eval
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-eval
# Eval (uncertainty model):
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-eval-uncertainty
# Train (original PGN3DCD):
#   Local Mac:   docker compose --profile local up local-cpu-train
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-train
# Train (uncertainty model):
#   Local Mac:   docker compose --profile local up local-cpu-train-uncertainty
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-train-uncertainty
# ---------------------------------------------------------------------------

x-common-env: &common-env
  CHECKPOINT_PATH: /data/SiamEncFusionKPConv.pt
  DATA_DIR: /data/HKCD
  OUTPUT_DIR: /output
  BATCH_SIZE: ${BATCH_SIZE:-4}
  NUM_WORKERS: ${NUM_WORKERS:-2}
  MAX_BATCHES: ${MAX_BATCHES:-0}
  PYTHONPATH: /tp3d

services:

  # ── local CPU ───────────────────────────────────────────────────────────
  local-cpu-eval:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=PGN3DCD_patched", "output_dir=/output", "training.weight_name=miou"]

  local-cpu-shell:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - .:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    entrypoint: [ "sleep", "infinity" ]
  # ────────────────────────────────────────────────────────────────────────

  # ── GCP CPU VM ──────────────────────────────────────────────────────────
  gcp-cpu-eval:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      network: host
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    network_mode: host
    shm_size: '4gb'
    volumes:
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=PGN3DCD_patched", "output_dir=/output" ]

  gcp-cpu:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      network: host
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    network_mode: host
    shm_size: '4gb'
    volumes:
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d

  gcp-cpu-shell:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    entrypoint: [ "sleep", "infinity" ]
  # ────────────────────────────────────────────────────────────────────────

  # ── GCP GPU VM ──────────────────────────────────────────────────────────
  gcp-gpu-eval:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=SiamKPConvWithPriorUncertainty", "output_dir=/output", "training.weight_name=miou_ch" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gcp-gpu-train:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "trainSiamKPConv.py"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # ────────────────────────────────────────────────────────────────────────