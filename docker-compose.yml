# docker-compose.yml
# ---------------------------------------------------------------------------
# Eval (baseline):
#   Local Mac:   docker compose --profile local up local-cpu-eval
#   GCP CPU VM:  docker compose --profile gcp-cpu --env-file .env.gcp up gcp-cpu-eval
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-eval
# Eval (uncertainty model):
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-eval-uncertainty
# Train (original PGN3DCD):
#   Local Mac:   docker compose --profile local up local-cpu-train
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-train
# Train (uncertainty model):
#   Local Mac:   docker compose --profile local up local-cpu-train-uncertainty
#   GCP GPU VM:  docker compose --profile gcp-gpu --env-file .env.gcp up gcp-gpu-train-uncertainty
# ---------------------------------------------------------------------------

services:

  # ── local CPU ───────────────────────────────────────────────────────────
  local-cpu-eval:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=PGN3DCD_patched", "output_dir=/output", "training.weight_name=miou"]

  local-cpu-shell:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - .:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    entrypoint: [ "sleep", "infinity" ]

  local-eval-uncertainty:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConvWithPriorUncertainty.py", "training.checkpoint_dir=/checkpoints", "model_name=SiamKPConvWithPriorUncertainty_retrained", "output_dir=/output", "training.weight_name=miou_ch" ]
  # ────────────────────────────────────────────────────────────────────────

  # ── GCP CPU VM ──────────────────────────────────────────────────────────
  gcp-cpu-eval:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      network: host
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    network_mode: host
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=PGN3DCD_patched", "output_dir=/output", "training.weight_name=miou_ch"]

  gcp-cpu:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
      network: host
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    network_mode: host
    shm_size: '4gb'
    volumes:
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d

  gcp-cpu-shell:
    profiles: [gcp-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: pgn3dcd-cpu:latest
    platform: linux/amd64
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    entrypoint: [ "sleep", "infinity" ]
  # ────────────────────────────────────────────────────────────────────────

  # ── GCP GPU VM ──────────────────────────────────────────────────────────
  gcp-gpu-eval:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConv.py", "training.checkpoint_dir=/checkpoints", "model_name=PGN3DCD_patched", "output_dir=/output", "training.weight_name=miou_ch" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gcp-gpu-train:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "trainSiamKPConv.py", "output_dir=/output/PGN3DCD_retrained"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # ────────────────────────────────────────────────────────────────────────

  gcp-gpu-eval-uncertainty:
    profiles: [ gcp-gpu ]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: [ "python3", "eval_SiamKPConvWithPriorUncertainty.py", "training.checkpoint_dir=/checkpoints", "model_name=SiamKPConvWithPriorUncertainty_5F", "output_dir=/output", "training.weight_name=miou_ch" ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]

  gcp-gpu-train-uncertainty:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "trainSiamKPConvWithPriorUncertainty.py", "output_dir=/output/SiamKPConvWithPriorUncertainty5F"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  # ────────────────────────────────────────────────────────────────────────

  # ── Fast debug training (class-balanced 4-scene subset, short schedule) ──
  # Train on /data/HKCD/Train_debug (created by
  # pgn3dcd_experiments/make_train_subset.py) with a fresh preprocessed_dir
  # and a reduced schedule, for ~12x faster iteration than the full run.
  # Run baseline first so it builds the shared preprocessed_debug cache; the
  # uncertainty run then reuses it.
  gcp-gpu-train-fast:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "trainSiamKPConv.py",
              "output_dir=/output/PGN3DCD_debug",
              "data.dataTrainFile=/data/HKCD/Train_subset/",
              "data.preprocessed_dir=/data/HKCD/preprocessed_debug/",
              "data.sample_per_epoch=1800",
              "training.epochs=150"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gcp-gpu-train-fast-uncertainty:
    profiles: [gcp-gpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
      network: host
    image: pgn3dcd-gpu:latest
    platform: linux/amd64
    network_mode: host
    runtime: nvidia
    shm_size: '4gb'
    volumes:
      - ${PROJECT_PATH:-.}:/tp3d:rw
      - ${CHECKPOINTS_DIR:?Set CHECKPOINTS_DIR in .env}:/checkpoints:ro
      - ${DATA_PATH:?Set DATA_PATH in .env}:/data:rw
      - ${OUTPUT_PATH:?Set OUTPUT_PATH in .env}:/output:rw
    working_dir: /tp3d
    command: ["python3", "trainSiamKPConvWithPriorUncertainty.py",
              "output_dir=/output/PriorUnc_debug",
              "data.dataTrainFile=/data/HKCD/Train_subset/",
              "data.preprocessed_dir=/data/HKCD/preprocessed_debug/",
              "data.sample_per_epoch=1800",
              "training.epochs=150"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]